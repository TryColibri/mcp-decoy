name: Publish

on:
  workflow_call:
    inputs:
      version:
        description: Version to publish. The `v<version>` tag must exist.
        type: string
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm publish
