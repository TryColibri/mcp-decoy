name: Publish

on:
  workflow_call:
    inputs:
      version:
        description: Version to publish. The `v<version>` tag must exist.
        type: string
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this OIDC token for a publish
      # credential, so no npm token is stored. The trusted publisher on npmjs.com
      # must name this repository and the `main.yml` workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # `prepack` runs `pnpm build`, so the tarball is built from the tag.
      - run: npm publish
