name: Pull Request

on:
  # No `branches` filter: a stacked PR targets its parent branch, not `main`,
  # and still needs its checks to run.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
