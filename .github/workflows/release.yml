name: Release

on:
  workflow_call:
    outputs:
      version:
        description: Version semantic-release released, empty if it released nothing.
        value: ${{ jobs.release.outputs.version }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The deploy key is a bypass actor on the `main` ruleset, so
          # semantic-release can push its release commit and tag past the
          # required PR and status checks. GITHUB_TOKEN cannot bypass them.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: ./.github/actions/setup
      # semantic-release bumps package.json, commits it and tags the commit.
      # A changed version is how we tell that it released something.
      - id: release
        run: |
          before=$(node -p "require('./package.json').version")
          pnpm run release
          after=$(node -p "require('./package.json').version")
          if [ "$before" != "$after" ]; then
            echo "version=$after" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
